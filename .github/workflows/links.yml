name: links

# External links rot quietly - a dead Arbeitsagentur or anabin URL sends a
# user somewhere useless at the worst moment. Weekly, and never blocking a PR.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  external-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every external URL the skills point users at
        run: python3 tools/check-links.py
