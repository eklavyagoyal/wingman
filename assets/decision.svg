<svg xmlns="http://www.w3.org/2000/svg" width="900" height="516" viewBox="0 0 900 516" role="img"
     aria-label="Wingman deciding whether to apply in German or English, and surfacing a CEFR level gap">
  <defs>
    <style>
      .m { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14.5px; }
      .dim  { fill: #7d8590; }
      .txt  { fill: #c9d1d9; }
      .hi   { fill: #e6edf3; font-weight: 600; }
      .ok   { fill: #3fb950; }
      .warn { fill: #d29922; }
      .acc  { fill: #58a6ff; }
      .btn  { fill: #58a6ff; font-weight: 600; }
    </style>
  </defs>

  <rect x="1" y="1" width="898" height="514" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <path d="M1 13a12 12 0 0 1 12-12h874a12 12 0 0 1 12 12v31H1z" fill="#161b22"/>
  <line x1="1" y1="44" x2="899" y2="44" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="24" cy="22.5" r="5.5" fill="#ff5f57"/>
  <circle cx="44" cy="22.5" r="5.5" fill="#febc2e"/>
  <circle cx="64" cy="22.5" r="5.5" fill="#28c840"/>
  <text class="m dim" x="88" y="27.5">/wingman:evaluate  ·  beispiel-gmbh</text>

  <text class="m" x="30" y="82"><tspan class="dim">Language decision</tspan><tspan class="txt" dx="14">Senior Backend Engineer (m/w/d), Beispiel GmbH</tspan></text>

  <text class="m" x="30" y="122"><tspan class="dim">Recommendation</tspan><tspan class="hi" dx="22">Deutsch</tspan><tspan class="dim" dx="22">confidence: high</tspan></text>

  <text class="m" x="52" y="158"><tspan class="ok">✓</tspan><tspan class="txt" dx="14">Ad is written in German</tspan></text>
  <text class="m" x="52" y="184"><tspan class="ok">✓</tspan><tspan class="txt" dx="14">"Sehr gute Deutschkenntnisse (C1) erforderlich"</tspan></text>
  <text class="m" x="52" y="210"><tspan class="ok">✓</tspan><tspan class="txt" dx="14">Mittelstand manufacturer, Stuttgart</tspan></text>
  <text class="m" x="52" y="236"><tspan class="ok">✓</tspan><tspan class="txt" dx="14">Ad uses "Sie"  →  formal register</tspan></text>
  <text class="m" x="52" y="262"><tspan class="warn">!</tspan><tspan class="txt" dx="14">Your German: B2</tspan><tspan class="warn" dx="36">← gap against C1</tspan></text>

  <line x1="30" y1="288" x2="870" y2="288" stroke="#21262d" stroke-width="1"/>

  <text class="m txt" x="30" y="318">The ad asks for C1. Your profile says B2. Three honest paths:</text>

  <text class="m" x="52" y="356"><tspan class="acc">1</tspan><tspan class="txt" dx="16">Apply in German, state B2 on the CV. I keep the Anschreiben in</tspan></text>
  <text class="m dim" x="88" y="380">language you could actually reproduce out loud.</text>
  <text class="m" x="52" y="410"><tspan class="acc">2</tspan><tspan class="txt" dx="16">Apply in English. Works at international employers, rarely in</tspan></text>
  <text class="m dim" x="88" y="434">the public sector.</text>
  <text class="m" x="52" y="464"><tspan class="acc">3</tspan><tspan class="txt" dx="16">Skip it. If C1 is genuinely required, that's a real filter.</tspan></text>

  <rect x="30"  y="482" width="112" height="24" rx="5" fill="#161b22" stroke="#30363d"/>
  <rect x="154" y="482" width="112" height="24" rx="5" fill="#161b22" stroke="#30363d"/>
  <rect x="278" y="482" width="152" height="24" rx="5" fill="#161b22" stroke="#30363d"/>
  <text class="m btn" x="86"  y="499" text-anchor="middle">Deutsch</text>
  <text class="m btn" x="210" y="499" text-anchor="middle">English</text>
  <text class="m btn" x="354" y="499" text-anchor="middle">Both versions</text>
</svg>
